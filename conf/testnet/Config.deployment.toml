# This repo's deployment defaults for testnet, merged over the upstream network definition
# (conf/upstream/testnet-follower-conf.toml) by tools/sync-upstream-conf.sh into Config.toml.sample.
# Values rendered from .env at start (BTC peer, auth_token, metrics port, observers, stacker) are
# only defaults here.
[node]
working_dir = "/root/stacks-blockchain/data"
rpc_bind = "0.0.0.0:20443"
p2p_bind = "0.0.0.0:20444"
prometheus_bind = "0.0.0.0:9153"

[burnchain]
peer_host = "bitcoin.regtest.hiro.so"
rpc_port = 18443
peer_port = 18444

[connection_options]
auth_token = "1234"
private_neighbors = false
