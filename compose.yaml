## Stacks blockchain stack, runnable with plain Docker Compose from the repo root:
##   cp sample.env .env          # then edit NETWORK, COMPOSE_PROFILES, versions, credentials
##   docker compose up -d        # starts the profiles listed in COMPOSE_PROFILES (default: node,api)
##   docker compose --profile '*' down   # graceful stop of everything (node first, up to STACKS_SHUTDOWN_TIMEOUT)
##
## Profiles: node (stacks-node), api (API + postgres), signer, proxy (nginx).
## The one-shot `config` job renders conf/${NETWORK}/Config.toml (and Signer.toml) on every `up`;
## put your own TOML changes in conf/${NETWORK}/Config.overrides.toml / Signer.overrides.toml.
## Data lives under DATA_ROOT (default ./persistent-data/<network>/...); each component's path can be
## set on its own (STACKS_DATA_DIR, POSTGRES_DATA_DIR, SIGNER_DATA_DIR), e.g. a dedicated disk.
name: stacks-blockchain-docker

## The API's settings from .env, shared by the API and the event-replay job
x-api-environment: &api-environment
  NODE_ENV:
  PG_HOST:
  PG_PORT:
  PG_USER:
  PG_PASSWORD:
  PG_DATABASE:
  PG_SCHEMA:
  STACKS_CORE_EVENT_PORT:
  STACKS_CORE_EVENT_HOST:
  STACKS_BLOCKCHAIN_API_PORT:
  STACKS_BLOCKCHAIN_API_HOST:
  STACKS_BLOCKCHAIN_API_DB:
  STACKS_CORE_RPC_HOST:
  STACKS_CORE_RPC_PORT:
  STACKS_EXPORT_EVENTS_FILE:
  STACKS_API_ENABLE_FT_METADATA:
  STACKS_API_ENABLE_NFT_METADATA:
  STACKS_API_TOKEN_METADATA_ERROR_MODE:
  STACKS_ADDRESS_CACHE_SIZE:
  BNS_IMPORT_DIR:

x-api-volumes: &api-volumes
  - ${DATA_ROOT:-./persistent-data}/bns-data:/bns-data
  - ${EVENT_REPLAY_DIR:-${DATA_ROOT:-./persistent-data}/${NETWORK:-mainnet}/event-replay}:/tmp/event-replay

services:
  ## Renders the node/signer config from the templates, .env and the overrides files (tools/config)
  config:
    build:
      context: .
      dockerfile: tools/config/Dockerfile
    image: stacks-blockchain-docker-config:local
    ## Rebuild (from cache, seconds) on every up, so a repo update never runs a stale renderer
    pull_policy: build
    restart: "no"
    environment:
      - NETWORK
      - COMPOSE_PROFILES
      - BTC_HOST
      - BTC_RPC_USER
      - BTC_RPC_PASS
      - BTC_RPC_PORT
      - BTC_P2P_PORT
      - TBTC_HOST
      - TBTC_RPC_USER
      - TBTC_RPC_PASS
      - TBTC_RPC_PORT
      - TBTC_P2P_PORT
      - AUTH_TOKEN
      - NODE_METRICS_PORT
      - STACKS_SIGNER_PORT
      - SIGNER_METRICS_PORT
      - SIGNER_PRIVATE_KEY
      - TESTNET_SIGNER_PRIVATE_KEY
      - STACKS_CORE_RPC_HOST
      - STACKS_CORE_RPC_PORT
      - STACKS_CORE_EVENT_PORT
      - API_EVENT_ENDPOINT
      - API_OBSERVER_TIMEOUT_MS
      - MONITORING_CONTAINER_METRICS
    volumes:
      - ./conf:/conf

  ## Validates the rendered config with the pinned node before the node starts (catches D50-type breakage)
  config-check:
    image: ghcr.io/stacks-network/stacks-core:${STACKS_BLOCKCHAIN_VERSION:-latest}
    restart: "no"
    profiles: [node]
    entrypoint: ["/bin/stacks-node", "check-config", "--config", "/src/stacks-blockchain/Config.toml"]
    volumes:
      - ./conf/${NETWORK:-mainnet}:/src/stacks-blockchain:ro
    depends_on:
      config:
        condition: service_completed_successfully

  signer-config-check:
    image: ghcr.io/stacks-network/stacks-signer:${STACKS_SIGNER_VERSION:-latest}
    restart: "no"
    profiles: [signer]
    entrypoint: ["/bin/stacks-signer", "check-config", "--config", "/src/stacks-signer/Signer.toml"]
    volumes:
      - ./conf/${NETWORK:-mainnet}:/src/stacks-signer:ro
    depends_on:
      config:
        condition: service_completed_successfully

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: postgres
    restart: on-failure
    profiles: [api, event-replay]
    shm_size: ${PG_SHMSIZE:-256MB}
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRES_DB=${PG_DATABASE:-postgres}
      ## read by scripts/postgres-initdb.sh
      - PG_USER
      - PG_DATABASE
      - PG_SCHEMA
    volumes:
      - ${POSTGRES_DATA_DIR:-${DATA_ROOT:-./persistent-data}/${NETWORK:-mainnet}/postgres}:/var/lib/postgresql/data
      - ./scripts/postgres-initdb.sh:/docker-entrypoint-initdb.d/postgres-initdb.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER:-postgres}", "-d", "${PG_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  stacks-blockchain-api:
    image: hirosystems/stacks-blockchain-api:${STACKS_BLOCKCHAIN_API_VERSION:-latest}
    container_name: stacks-blockchain-api
    restart: always
    profiles: [api]
    command: ["npm", "run", "start"]
    ports:
      - ${STACKS_BLOCKCHAIN_API_PORT:-3999}:${STACKS_BLOCKCHAIN_API_PORT:-3999}
    ## STACKS_CHAIN_ID per network
    env_file:
      - ./conf/${NETWORK:-mainnet}/api.env
    environment: *api-environment
    volumes: *api-volumes
    ## The API opens its event port (3700) right away but serves HTTP only once the node's RPC
    ## answers, i.e. after the node's initial Bitcoin header sync: same start period as the node
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.STACKS_BLOCKCHAIN_API_PORT||3999)+'/extended/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy

  stacks-blockchain:
    image: ghcr.io/stacks-network/stacks-core:${STACKS_BLOCKCHAIN_VERSION:-latest}
    container_name: stacks-blockchain
    restart: on-failure
    profiles: [node]
    command: ["/bin/stacks-node", "start", "--config", "/src/stacks-blockchain/Config.toml"]
    ## Let the run loop finish: killing it early can corrupt the chainstate
    stop_grace_period: ${STACKS_SHUTDOWN_TIMEOUT:-1200}s
    ports:
      - ${STACKS_CORE_RPC_PORT:-20443}:${STACKS_CORE_RPC_PORT:-20443}
      - ${STACKS_CORE_P2P_PORT:-20444}:${STACKS_CORE_P2P_PORT:-20444}
      - ${METRICS_BIND_ADDR:-127.0.0.1}:${NODE_METRICS_PORT:-9153}:${NODE_METRICS_PORT:-9153}
    environment:
      - RUST_BACKTRACE
      - STACKS_LOG_DEBUG
      - STACKS_LOG_JSON
      - STACKS_EVENT_OBSERVER
    volumes:
      - ./conf/${NETWORK:-mainnet}:/src/stacks-blockchain:ro
      - ${STACKS_DATA_DIR:-${DATA_ROOT:-./persistent-data}/${NETWORK:-mainnet}/stacks-blockchain}:/root/stacks-blockchain/data
    ## RPC stays down during the initial Bitcoin header sync (minutes, refactor/15 P1), hence the long start period
    healthcheck:
      ## stacks-node 4.x answers a request without a Host header with 400
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/20443 && printf 'GET /v2/info HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    depends_on:
      config-check:
        condition: service_completed_successfully
      ## The node blocks on its API observer while the API is down (D46), so start the API first.
      ## Not service_healthy: the API's HTTP side waits for the node's RPC (that would deadlock);
      ## its event port, which is all the node needs, is up as soon as it starts
      stacks-blockchain-api:
        condition: service_started
        required: false
      ## Same for the signer observer. This also orders `down`: the node stops before its observers;
      ## stopping an observer first leaves the node retrying deliveries until it is killed
      stacks-signer:
        condition: service_started
        required: false
      ## Only orders `down`: monitoring keeps running until the node has stopped (refactor/12)
      prometheus:
        condition: service_started
        required: false

  stacks-signer:
    image: ghcr.io/stacks-network/stacks-signer:${STACKS_SIGNER_VERSION:-latest}
    container_name: stacks-signer
    restart: on-failure
    profiles: [signer]
    command: ["/bin/stacks-signer", "run", "--config", "/src/stacks-signer/Signer.toml"]
    ports:
      - ${METRICS_BIND_ADDR:-127.0.0.1}:${SIGNER_METRICS_PORT:-9154}:${SIGNER_METRICS_PORT:-9154}
    volumes:
      - ./conf/${NETWORK:-mainnet}:/src/stacks-signer:ro
      - ${SIGNER_DATA_DIR:-${DATA_ROOT:-./persistent-data}/${NETWORK:-mainnet}/stacks-signer}:/root/stacks-signer/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${SIGNER_METRICS_PORT:-9154}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ## Starts before the node (the node depends on it) and retries until the node's RPC answers
    depends_on:
      signer-config-check:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: on-failure
    profiles: [proxy]
    ports:
      - ${NGINX_PROXY_PORT:-80}:80
    volumes:
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      stacks-blockchain-api:
        condition: service_started
        required: false

  ## API event replay (export or import of the node's event history). Run with the node and API
  ## stopped: EVENT_REPLAY_ACTION=export|import docker compose --profile event-replay up -d
  ## (import wipes the API database first). Follow it with: docker compose logs -f event-replay
  event-replay:
    image: hirosystems/stacks-blockchain-api:${STACKS_BLOCKCHAIN_API_VERSION:-latest}
    container_name: event-replay
    restart: "no"
    profiles: [event-replay]
    env_file:
      - ./conf/${NETWORK:-mainnet}/api.env
    environment:
      <<: *api-environment
      EVENT_REPLAY_ACTION:
    command:
      - /bin/sh
      - -c
      - |
        case "$${EVENT_REPLAY_ACTION}" in
          export) rm -f "$${STACKS_EXPORT_EVENTS_FILE}" && exec node ./lib/index.js export-events --file "$${STACKS_EXPORT_EVENTS_FILE}" ;;
          import) exec node ./lib/index.js import-events --file "$${STACKS_EXPORT_EVENTS_FILE}" --wipe-db --force ;;
          *) echo "event-replay: set EVENT_REPLAY_ACTION=export or import" >&2; exit 2 ;;
        esac
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy

  ## Legacy BNS v1 data for a genesis sync with BNS_IMPORT_DIR set: docker compose --profile bns up
  bns:
    image: bash
    container_name: bns_data
    restart: "no"
    profiles: [bns]
    working_dir: /srv
    environment:
      - BNS_IMPORT_DIR
      - USER_ID
    volumes:
      - ${DATA_ROOT:-./persistent-data}/bns-data:/bns-data
      - ./scripts:/scripts:ro
    command: ["sh", "-c", "/scripts/setup-bns.sh"]

  ## ---------------------------------------------------------------------------------------------
  ## monitoring profile (refactor/12): Prometheus + exporters + Grafana. Opt in by adding `monitoring`
  ## to COMPOSE_PROFILES. Ports bind to MONITORING_BIND (127.0.0.1); only explicit environment is passed.
  ## The scrape targets in conf/monitoring/prometheus.yml are rendered by the config job.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    container_name: stacks-prometheus
    restart: on-failure
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - ${MONITORING_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./conf/monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      config:
        condition: service_completed_successfully

  ## Per-container CPU/memory/IO/network. Needs host mounts and privileged mode;
  ## MONITORING_CONTAINER_METRICS=0 leaves it out (and out of the scrape targets)
  cadvisor:
    ## v0.55+ is needed with the Docker 29 containerd image store; older versions only see the root cgroup
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.55.1}
    container_name: stacks-cadvisor
    restart: on-failure
    profiles: [monitoring]
    deploy:
      replicas: ${MONITORING_CONTAINER_METRICS:-1}
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,disk,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  ## Host disk/memory/load. On Docker Desktop it sees the Linux VM, not the Mac/Windows host
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    container_name: stacks-node-exporter
    restart: on-failure
    profiles: [monitoring]
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro

  ## Needs the API's database credentials (read access is all it uses)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.20.1}
    container_name: stacks-postgres-exporter
    restart: on-failure
    profiles: [monitoring]
    environment:
      - DATA_SOURCE_URI=${PG_HOST:-postgres}:${PG_PORT:-5432}/${PG_DATABASE:-postgres}?sslmode=disable
      - DATA_SOURCE_USER=${PG_USER:-postgres}
      - DATA_SOURCE_PASS=${PG_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  ## Dashboards (Stacks node, Containers, Host). Refuses to start without GRAFANA_ADMIN_PASSWORD;
  ## MONITORING_GRAFANA=0 leaves it out
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    container_name: stacks-grafana
    restart: on-failure:3
    profiles: [monitoring]
    deploy:
      replicas: ${MONITORING_GRAFANA:-1}
    ports:
      - ${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$${GF_SECURITY_ADMIN_PASSWORD}" ] || { echo "grafana: set GRAFANA_ADMIN_PASSWORD in .env (or MONITORING_GRAFANA=0)" >&2; exit 1; }
        exec /run.sh
    volumes:
      - ./conf/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./conf/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_started

## Monitoring data is disposable (metrics, dashboards state), so it uses named volumes rather than
## DATA_ROOT; `docker compose down -v` removes it
volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${DOCKER_NETWORK:-stacks}
