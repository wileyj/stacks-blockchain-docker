## Phase 0 safety net (refactor/11-refactor-guidance.md §D.1, §E).
## Every script under .github/ci/ also runs locally; none of them touch the repo's .env, conf/ or persistent-data/.
name: CI

on:
  pull_request:
  push:
    branches: [master, chore/refactor, refactor-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: shellcheck + compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      ## Error level only for now; the existing warnings are cleaned up in phase 1
      - name: shellcheck
        run: shellcheck -x -S error manage.sh scripts/*.sh tools/*.sh .github/ci/*.sh
      - name: docker compose config (every network x profile x flag)
        run: .github/ci/compose-config.sh
      - name: build the seed job image (runs its unit tests)
        run: docker build -q -f tools/seed/Dockerfile -t seed-ci .
      - name: monitoring rules (promtool check + unit tests) and dashboards (valid JSON)
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.15.0 check rules conf/monitoring/rules/stacks.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.15.0 test rules tools/monitoring/stacks.test.yml
          for f in conf/monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }; done

  harness:
    name: manage.sh characterization harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: harness --check
        if: hashFiles('refactor/harness/run.sh') != ''
        run: refactor/harness/run.sh --check

  check-config:
    name: check-config on rendered configs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: render with the config job, validate with the pinned images
        run: .github/ci/check-config.sh mainnet testnet

  ## Plain `docker compose` from the repo root, no manage.sh (refactor/14 §2.1 R7). Also builds the
  ## config renderer image, which runs its unit tests during the build.
  compose-boot:
    name: compose-only boot (${{ matrix.network }} ${{ matrix.profiles }})
    needs: [static]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {network: testnet, profiles: "node,api"}
          - {network: mainnet, profiles: "node"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: docker compose up -d, hold 180s, docker compose --profile '*' down
        run: .github/ci/compose-boot.sh ${{ matrix.network }} ${{ matrix.profiles }} 180
