## Release (refactor/11 §D.1 phase 4): on a pushed v* tag only. Publishes the sbd binary as a GitHub
## Release and the sbd image to ghcr.io/<owner>/sbd. A tag with a suffix (v1.2.3-rc.1) is a prerelease
## and doesn't move the image's `latest`. Write access is granted per job, only where it publishes.
## For now Linux x86-64 only (owner, 2026-11-02); the code also builds for darwin, windows, freebsd and
## arm64, so more targets are a matter of the lists below.
## Protection (owner, 2026-11-05): a tag ruleset lets only the repo admin create, move or delete v* tags;
## the tag must be signed by a key in .github/release-signers.asc (checked first); releases are
## immutable once published; the binary, SHA256SUMS and the image carry build provenance attestations
## (gh attestation verify <file> --repo <owner>/<repo>).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: build sbd binaries
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/sbd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      ## checkout leaves the tag as a plain ref: fetch the tag object itself, then check its signature
      - name: verify the tag is signed by an allowed key
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ] || { echo "::error::${TAG} is not an annotated, signed tag"; exit 1; }
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          gpg --batch --quiet --import .github/release-signers.asc
          git verify-tag "${TAG}" || { echo "::error::${TAG} is not signed by a key in .github/release-signers.asc"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: vet and test
        run: go vet ./... && go test ./...
      - name: build linux/amd64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "dist/sbd-${VERSION}-${os}-${arch}" .
          done
          (cd dist && sha256sum sbd-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbd-binaries
          path: tools/sbd/dist/
          if-no-files-found: error

  github-release:
    name: publish the GitHub Release
    needs: [binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbd-binaries
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre \
            --title "sbd $TAG"

  image:
    name: publish the sbd image (linux/amd64)
    needs: [binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: build and push ghcr.io/<owner>/sbd:<tag> (and latest for a final release)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sbd"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "${image}:${TAG}")
          [[ "$TAG" == *-* ]] || tags+=(-t "${image}:latest")
          docker build --platform linux/amd64 --build-arg VERSION="$TAG" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$TAG" \
            "${tags[@]}" tools/sbd
          docker run --rm "${image}:${TAG}" version
          for t in "${tags[@]}"; do [ "$t" = -t ] || docker push "$t"; done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${TAG}"); digest=${digest#*@}
          echo "name=${image}" >> "$GITHUB_OUTPUT"; echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        id: push
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
