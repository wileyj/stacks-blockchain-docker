## promtool unit tests for conf/monitoring/rules/stacks.yml:
##   docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.15.0 test rules tools/monitoring/stacks.test.yml
rule_files:
  - ../../conf/monitoring/rules/stacks.yml
evaluation_interval: 1m
tests:
  ## Tip frozen while the node has peers: fires after 5m of no change + 5m
  - interval: 1m
    input_series:
      - series: 'stacks_node_stacks_tip_height{job="stacks-node"}'
        values: '100+1x10 110x50'
      - series: 'stacks_node_neighbors_outbound{job="stacks-node"}'
        values: '8x60'
    alert_rule_test:
      - eval_time: 18m
        alertname: StacksTipStalled
        exp_alerts: []
      - eval_time: 21m
        alertname: StacksTipStalled
        exp_alerts:
          - exp_labels: {severity: critical, job: stacks-node}
            exp_annotations:
              summary: "Stacks tip hasn't advanced for 10 minutes"
              description: "No new Stacks block in 10 minutes although the node has peers. Either the node can't get a block it is missing from its peers, or a blocked event observer (API or signer down) is stalling it (refactor/09 D46/D55)."

  ## A network-wide pause at a tenure change (6 min on the mainnet soak, 2026-11-13) must not fire
  - interval: 1m
    input_series:
      - series: 'stacks_node_stacks_tip_height{job="stacks-node"}'
        values: '100+1x10 110x6 111+1x20'
      - series: 'stacks_node_neighbors_outbound{job="stacks-node"}'
        values: '8x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: StacksTipStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: StacksTipStalled
        exp_alerts: []

  ## No peers yet (boot): a frozen tip must not page
  - interval: 1m
    input_series:
      - series: 'stacks_node_stacks_tip_height{job="stacks-node"}'
        values: '0x60'
      - series: 'stacks_node_neighbors_outbound{job="stacks-node"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: StacksTipStalled
        exp_alerts: []

  ## API lag: recording rule value and the alert after 10m above 10 blocks. The lag is 0 for 10m,
  ## then a constant 20 (so the alert's {{ $value }} doesn't depend on which sample is evaluated)
  - interval: 1m
    input_series:
      - series: 'stacks_node_stacks_tip_height{job="stacks-node"}'
        values: '1000+1x9 1030+1x20'
      - series: 'stacks_block_height{job="stacks-api"}'
        values: '1000+1x30'
    promql_expr_test:
      - expr: stacks:api_lag
        eval_time: 20m
        exp_samples:
          - labels: 'stacks:api_lag'
            value: 20
    alert_rule_test:
      - eval_time: 15m
        alertname: StacksApiBehindNode
        exp_alerts: []
      - eval_time: 25m
        alertname: StacksApiBehindNode
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "API is 20 blocks behind the node"
              description: "The API isn't keeping up with the node's events. Check the API and postgres logs."

  ## A down target alerts only after the 15m header-sync grace
  - interval: 1m
    input_series:
      - series: 'up{job="stacks-signer", instance="stacks-signer:9154"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: StacksTargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: StacksTargetDown
        exp_alerts:
          - exp_labels: {severity: warning, job: stacks-signer, instance: "stacks-signer:9154"}
            exp_annotations:
              summary: "stacks-signer metrics unreachable"
              description: "Prometheus can't scrape stacks-signer:9154 (stacks-signer). On a fresh node this is normal during the initial Bitcoin header sync."

  ## Burn height: a fresh series (restart) stays quiet without 2 h of history; a routine 90-min Bitcoin
  ## gap stays quiet; 2.5 h without a change fires
  - interval: 1m
    input_series:
      - series: 'stacks_node_burn_block_height{job="stacks-node", instance="stacks-blockchain:9153"}'
        values: '900000x90 900001x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: StacksBurnchainStalled
        exp_alerts: []
      - eval_time: 230m
        alertname: StacksBurnchainStalled
        exp_alerts: []
      - eval_time: 250m
        alertname: StacksBurnchainStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: stacks-node, instance: "stacks-blockchain:9153"}
            exp_annotations:
              summary: "Burn (Bitcoin) height hasn't advanced for 2.5 hours"
              description: "No change in the node's burn height for 2.5 hours. Check the Bitcoin peer (BTC_HOST) and the node's log; a node still catching up from a snapshot also holds its burn height while it processes Stacks blocks."
